  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #message {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
    }

    #map {
      display: none;
      flex: 1 1 auto;
      width: 100%;
      min-height: 300px;
      background: #f4f4f4;
    }

    #status {
      display: none;
      flex: 0 0 auto;
      padding: 6px 8px 2px;
      font-size: 14px;
      line-height: 1.5;
      background: #fff;
    }

    #note {
      display: none;
      flex: 0 0 auto;
      padding: 2px 8px 7px;
      font-size: 11px;
      line-height: 1.5;
      color: #555;
      background: #fff;
    }

    .mikoshi-leaflet-icon {
      background: transparent;
      border: none;
    }

    .mikoshi-pin {
      position: relative;
      width: 70px;
      height: 80px;
    }

    .mikoshi-badge {
      position: absolute;
      left: 3px;
      top: 2px;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 4px solid #8A2D24;
      border-radius: 50%;
      box-sizing: border-box;
      box-shadow:
        0 0 0 2px rgba(255,255,255,.98),
        0 3px 8px rgba(0,0,0,.42);
      z-index: 2;
    }

    .mikoshi-badge img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .mikoshi-pin::after {
      content: "";
      position: absolute;
      left: 27px;
      top: 62px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 15px solid #8A2D24;
      z-index: 1;
    }
  </style>
</head>

    const map = L.map('map', { zoomControl: true });

    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    const mikoshiIcon = L.divIcon({
      className: 'mikoshi-leaflet-icon',
      html:
        '<div class="mikoshi-pin">' +
          '<div class="mikoshi-badge">' +
            '<img src="' + MIKOSHI_IMAGE + '" alt="神輿">' +
          '</div>' +
        '</div>',
      iconSize: [70, 80],
      iconAnchor: [35, 77],
      popupAnchor: [0, -66]
    });

    let marker = null;
    let accuracyCircle = null;
    let firstLocation = true;
    let pollTimer = null;
    let activeJsonpScript = null;
    let responseTimer = null;

    // Apps Script が必ずこの固定名を呼び出す。
    window.receiveMikoshiData = function(state) {
      clearResponseTimer();

      if (activeJsonpScript && activeJsonpScript.parentNode) {
        activeJsonpScript.parentNode.removeChild(activeJsonpScript);
      }
      activeJsonpScript = null;

      showState(state);
      scheduleNext();
    };

    function clearResponseTimer() {
      if (responseTimer) {
        clearTimeout(responseTimer);
        responseTimer = null;
      }
    }

    function scheduleNext() {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(loadPublicState, 15000);
    }

    function loadPublicState() {
      if (!API_URL || API_URL === 'https://script.google.com/macros/s/AKfycby28ocEO8SKgqWY76JBCE05VC1O_rmSKJeW99-uf_htnmyu7-k_gU5sIc0L_KV_b7mN/exec') {
        document.getElementById('message').textContent =
          'API_URL が設定されていません。';
        return;
      }

      if (activeJsonpScript && activeJsonpScript.parentNode) {
        activeJsonpScript.parentNode.removeChild(activeJsonpScript);
      }

      activeJsonpScript = document.createElement('script');

      const separator = API_URL.includes('?') ? '&' : '?';

      activeJsonpScript.src =
        API_URL +
        separator +
        'mode=public' +
        '&callback=receiveMikoshiData' +
        '&_=' + Date.now();

      activeJsonpScript.onerror = function() {
        clearResponseTimer();
        document.getElementById('message').style.display = marker ? 'none' : 'flex';

        if (!marker) {
          document.getElementById('message').textContent =
            '位置情報に接続しています…';
        }

        setTimeout(loadPublicState, 2000);
      };

      document.body.appendChild(activeJsonpScript);

      clearResponseTimer();
      responseTimer = setTimeout(function() {
        if (!marker) {
          document.getElementById('message').textContent =
            '位置情報に接続しています…';
        }
        loadPublicState();
      }, 8000);
    }

    function showState(state) {
      const message = document.getElementById('message');
      const mapDiv = document.getElementById('map');
      const status = document.getElementById('status');
      const note = document.getElementById('note');

      if (!state || !state.isPublic) {
        mapDiv.style.display = 'none';
        status.style.display = 'none';
        note.style.display = 'none';

        message.style.display = 'flex';
        message.textContent =
          '現在、神輿の位置情報は公開していません。';
        return;
      }

      if (!state.latest) {
        mapDiv.style.display = 'none';
        status.style.display = 'none';
        note.style.display = 'none';

        message.style.display = 'flex';
        message.textContent =
          '神輿の位置情報が届くまで、しばらくお待ちください。';
        return;
      }

      message.style.display = 'none';
      mapDiv.style.display = 'block';
      status.style.display = 'block';
      note.style.display = 'block';

      showLocation(state.latest);

      requestAnimationFrame(function() {
        map.invalidateSize();
      });
    }

    function showLocation(data) {
      const lat = Number(data.lat);
      const lon = Number(data.lon);
      const accuracy = Number(data.accuracy);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        return;
      }

      const point = [lat, lon];

      if (!marker) {
        marker = L.marker(
          point,
          {
            icon: mikoshiIcon,
            zIndexOffset: 1000
          }
        ).addTo(map);

        marker.bindPopup('<strong>神輿の現在位置</strong>');
      } else {
        marker.setLatLng(point);
      }

      if (Number.isFinite(accuracy) && accuracy > 0) {
        if (!accuracyCircle) {
          accuracyCircle = L.circle(
            point,
            {
              radius: accuracy,
              color: '#8A2D24',
              weight: 1,
              opacity: 0.5,
              fillColor: '#8A2D24',
              fillOpacity: 0.05
            }
          ).addTo(map);
        } else {
          accuracyCircle.setLatLng(point);
          accuracyCircle.setRadius(accuracy);
        }
      }

      if (firstLocation) {
        map.setView(point, 17);
        firstLocation = false;
      }

      const updated = new Date(data.receivedAt);
      const seconds = Math.max(
        0,
        Math.floor((new Date() - updated) / 1000)
      );

      let ageText;
      if (seconds < 60) {
        ageText = '1分以内';
      } else if (seconds < 3600) {
        ageText = Math.floor(seconds / 60) + '分前';
      } else {
        ageText = Math.floor(seconds / 3600) + '時間以上前';
      }

      const timeText = updated.toLocaleTimeString(
        'ja-JP',
        {
          timeZone: 'Asia/Tokyo',
          hour: '2-digit',
          minute: '2-digit'
        }
      );

      let accuracyText = '';
      if (Number.isFinite(accuracy) && accuracy > 0) {
        accuracyText =
          '　位置精度：約' + Math.round(accuracy) + 'm';
      }

      document.getElementById('status').textContent =
        '最終更新 ' +
        timeText +
        '（' +
        ageText +
        '）' +
        accuracyText;

      marker.setPopupContent(
        '<strong>神輿の現在位置</strong><br>' +
        '最終更新 ' + timeText +
        (
          Number.isFinite(accuracy) && accuracy > 0
            ? '<br>位置精度：約' + Math.round(accuracy) + 'm'
            : ''
        )
      );
    }

    function refreshImmediately() {
      if (pollTimer) clearTimeout(pollTimer);
      clearResponseTimer();
      loadPublicState();
    }

    loadPublicState();

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        refreshImmediately();
      }
    });

    window.addEventListener('pageshow', refreshImmediately);
    window.addEventListener('online', refreshImmediately);
  </script>
